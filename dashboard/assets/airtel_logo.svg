<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="airtelRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="100%" stop-color="#D60000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Airtel Icon: Iconic curved organic loop -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="url(#airtelRedGrad)"/>
    <path d="M 22 42 C 22 24 38 22 38 31 C 38 37 32 39 26 36 C 24 35 24 30 29 29 C 34 28 35 32 33 34" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="22" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Airtel Wordmark -->
  <text x="82" y="49" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">airtel</text>
  <!-- Small Enterprise Tag -->
  <rect x="195" y="27" width="75" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="202" y="40" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="1">ANALYTICS</text>
</svg>
