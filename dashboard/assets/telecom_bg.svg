<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="airtelGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#E60000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E60000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navyGlow" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#14213D" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#14213D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E60000" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <rect width="100%" height="100%" fill="url(#dotGrid)"/>
  <rect width="100%" height="100%" fill="url(#airtelGlow)"/>
  <rect width="100%" height="100%" fill="url(#navyGlow)"/>
  <!-- Abstract telecom signal arcs and connection vectors -->
  <g stroke="#E60000" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="4 6">
    <circle cx="150" cy="120" r="80"/>
    <circle cx="150" cy="120" r="140"/>
    <circle cx="150" cy="120" r="200"/>
    <circle cx="1280" cy="780" r="90"/>
    <circle cx="1280" cy="780" r="160"/>
    <circle cx="1280" cy="780" r="230"/>
  </g>
  <g stroke="#14213D" stroke-opacity="0.07" stroke-width="1.2">
    <line x1="150" y1="120" x2="480" y2="240"/>
    <line x1="480" y1="240" x2="820" y2="160"/>
    <line x1="820" y1="160" x2="1180" y2="310"/>
    <line x1="1180" y1="310" x2="1280" y2="780"/>
    <line x1="480" y1="240" x2="620" y2="580"/>
    <line x1="620" y1="580" x2="1020" y2="640"/>
    <line x1="1020" y1="640" x2="1280" y2="780"/>
  </g>
  <g fill="#E60000" fill-opacity="0.25">
    <circle cx="150" cy="120" r="4.5"/>
    <circle cx="480" cy="240" r="3.5"/>
    <circle cx="820" cy="160" r="4.0"/>
    <circle cx="1180" cy="310" r="3.5"/>
    <circle cx="620" cy="580" r="4.0"/>
    <circle cx="1020" cy="640" r="3.5"/>
    <circle cx="1280" cy="780" r="5.0"/>
  </g>
</svg>
